  <body>
    <div id="root"></div>
    <script>
      (function () {
        var path = location.pathname
        if (path.length > 1 && path.endsWith("/")) path = path.slice(0, -1)
        if (path === "/" && location.search === "") return
        var root = document.getElementById("root")
        if (root) root.textContent = ""
      })()
    </script>
