name: Caddy validate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: caddy-validate-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  caddy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy gate tests
        run: node --test scripts/__test__/deploy-gate.test.mjs scripts/__test__/vps-pull.test.mjs scripts/__test__/vps-prune-app-images.test.mjs

      - name: Validate Caddyfile with the production image
        run: sh scripts/validate-caddyfile.sh
