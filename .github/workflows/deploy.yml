name: Build and Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository }}/teacher-exam-api
  WEB_IMAGE: ghcr.io/${{ github.repository }}/teacher-exam-web

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  commit-hash:
    runs-on: ubuntu-latest
    outputs:
      commit_hash: ${{ steps.get_commit.outputs.commit_hash }}
    steps:
      - uses: actions/checkout@v4
      - name: Get commit hash
        id: get_commit
        run: echo "commit_hash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  build-and-push-api:
    needs: commit-hash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ needs.commit-hash.outputs.commit_hash }}
            ${{ env.API_IMAGE }}:latest

  build-and-push-web:
    needs: commit-hash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_URL=https://api-ujian-sekolah.naufaldi.com/api
            VITE_APP_ORIGIN=https://ujian-sekolah.naufaldi.com
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
          tags: |
            ${{ env.WEB_IMAGE }}:${{ needs.commit-hash.outputs.commit_hash }}
            ${{ env.WEB_IMAGE }}:latest

  deploy:
    needs: [build-and-push-api, build-and-push-web, commit-hash, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to VPS
        id: switch
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 2400s
          script: |
            set -e

            cd ~/projects/teacher-exam

            # Sync to origin/main (VPS clone must not keep local edits — e.g. manual migration hotfixes block git pull)
            git fetch origin main
            git checkout -B main origin/main
            git reset --hard origin/main
            git clean -fd -e .env.production

            echo "Disk before image pull:"
            df -h /

            # Dangling images only. GHCR_PULL_TOKEN is an optional packages:read credential; the job token is the fallback.
            GHCR_USER='${{ github.actor }}' \
            GHCR_TOKEN='${{ secrets.GITHUB_TOKEN }}' \
            GHCR_PULL_TOKEN='${{ secrets.GHCR_PULL_TOKEN }}' \
            API_IMAGE='${{ env.API_IMAGE }}:${{ needs.commit-hash.outputs.commit_hash }}' \
            WEB_IMAGE='${{ env.WEB_IMAGE }}:${{ needs.commit-hash.outputs.commit_hash }}' \
              sh scripts/vps-pull.sh

            # Update GITHUB_REPOSITORY only; IMAGE_TAG is written after migrate succeeds
            grep -v "^GITHUB_REPOSITORY=" .env.production > .env.production.tmp || true
            mv .env.production.tmp .env.production
            echo "GITHUB_REPOSITORY=${{ github.repository }}" >> .env.production

            # Run DB migration with the new image (do not persist IMAGE_TAG until success)
            echo "Running database migration..."
            IMAGE_TAG="${{ needs.commit-hash.outputs.commit_hash }}" \
            GITHUB_REPOSITORY="${{ github.repository }}" \
            docker compose -f docker-compose.prod.yml --env-file .env.production \
              --profile migrate run --rm migrate 2>&1 | tee /tmp/migrate.log

            # Remember the tag that is still serving, then persist the new tag.
            grep '^IMAGE_TAG=' .env.production | head -n 1 | cut -d= -f2- | tr -d '[:space:]' > .deploy-previous-tag || true

            # Persist IMAGE_TAG only after migrate succeeds
            grep -v "^IMAGE_TAG=" .env.production > .env.production.tmp || true
            mv .env.production.tmp .env.production
            echo "IMAGE_TAG=${{ needs.commit-hash.outputs.commit_hash }}" >> .env.production

            # Restart services with new images. Public smoke runs on the runner after this step.
            echo "Restarting services..."
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d
            echo "Deployed ${{ needs.commit-hash.outputs.commit_hash }}"

      - name: Smoke public routes
        id: smoke
        run: node scripts/deploy-smoke.mjs

      - name: Roll back to the previous image
        if: failure() && steps.switch.outcome == 'success'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 300s
          script: |
            set -eu
            cd ~/projects/teacher-exam
            sh scripts/vps-rollback.sh

      - name: Prune dangling images
        if: success()
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 300s
          script: |
            set -eu
            docker image prune -f
